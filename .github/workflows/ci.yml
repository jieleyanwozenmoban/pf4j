name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build pf4j-core and run unit tests
        run: ./mvnw clean install -B

      - name: Build pf4j-demo-app and plugins
        run: |
          cd demo/maven
          ../../mvnw clean package -B

      - name: Simulate plugin loading and verify
        run: |
          # Create demo-dist folder
          rm -fr demo-dist
          mkdir -p demo-dist/plugins

          # Copy artifacts to demo-dist folder
          cp demo/maven/app/target/pf4j-demo-app-*.zip demo-dist/
          cp demo/maven/plugins/plugin1/target/pf4j-demo-plugin1-*-all.jar demo-dist/plugins/
          cp demo/maven/plugins/plugin2/target/pf4j-demo-plugin2-*-all.jar demo-dist/plugins/
          cp demo/maven/plugins/enabled.txt demo-dist/plugins/ || true
          cp demo/maven/plugins/disabled.txt demo-dist/plugins/ || true

          cd demo-dist

          # Unzip app
          jar xf pf4j-demo-app-*.zip
          rm pf4j-demo-app-*.zip

          # Run demo and save output
          mv pf4j-demo-app-*-SNAPSHOT.jar pf4j-demo.jar
          java -jar pf4j-demo.jar > demo.log 2>&1
          
          # Print log for debugging
          cat demo.log
          
          # Verify plugin loading in the output
          # We expect the log to indicate that extensions were found for Greeting
          if grep -q "Found .* extensions for extension point" demo.log; then
            echo "SUCCESS: Plugins successfully loaded and executed. See the logs below:"
            grep "Found .* extensions for extension point" demo.log
            grep ">>>" demo.log || true
          else
            echo "ERROR: Failed to load plugins."
            exit 1
          fi
