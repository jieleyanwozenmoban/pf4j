name: CI

on:
    push:
        branches:
            - '*'
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    build-test-demo:
        name: Build, Test and Verify Demo Plugins
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: maven

            - name: Build PF4J core and run unit tests
              run: ./mvnw -B -ntp clean install

            - name: Build pf4j-demo multi-module artifacts
              run: ./mvnw -B -ntp -f demo/maven/pom.xml clean package -DskipTests

            - name: Check packaged demo artifacts
              run: |
                  ls -lh demo/maven/app/target/pf4j-demo-app-*.zip
                  ls -lh demo/maven/plugins/plugin1/target/pf4j-demo-plugin1-*-all.jar
                  ls -lh demo/maven/plugins/plugin2/target/pf4j-demo-plugin2-*-all.jar

            - name: Simulate plugin loading and verify extension execution
              run: |
                  set -euo pipefail
                  rm -rf ci-demo-dist
                  mkdir -p ci-demo-dist/plugins
                  cp demo/maven/app/target/pf4j-demo-app-*.zip ci-demo-dist/
                  cp demo/maven/plugins/plugin1/target/pf4j-demo-plugin1-*-all.jar ci-demo-dist/plugins/
                  cp demo/maven/plugins/plugin2/target/pf4j-demo-plugin2-*-all.jar ci-demo-dist/plugins/
                  cp demo/maven/plugins/enabled.txt ci-demo-dist/plugins/
                  cp demo/maven/plugins/disabled.txt ci-demo-dist/plugins/
                  cd ci-demo-dist
                  jar xf pf4j-demo-app-*.zip
                  rm pf4j-demo-app-*.zip
                  mv pf4j-demo-app-*-SNAPSHOT.jar pf4j-demo.jar
                  java -jar pf4j-demo.jar 2>&1 | tee plugin-load.log
                  grep -q "Plugin 'welcome-plugin@0.0.1' resolved" plugin-load.log
                  grep -q "Plugin 'hello-plugin@0.0.1' resolved" plugin-load.log
                  grep -q "Start plugin 'welcome-plugin@0.0.1'" plugin-load.log
                  grep -q "Start plugin 'hello-plugin@0.0.1'" plugin-load.log
                  grep -q ">>> Welcome" plugin-load.log
                  grep -q ">>> Hello" plugin-load.log
                  echo "CI_PLUGIN_LOAD_SUCCESS: demo-app loaded welcome-plugin and hello-plugin from plugins directory"
